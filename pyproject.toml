[project]
name = "t-one-train"
version = "0.2.0"
description = "Reproducible synthetic Russian taxi telephone corpus for T-one"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.4,<2",
    "scipy>=1.14,<2",
    "soundfile>=0.13.1,<1",
    "torch==2.8.0",
]

[dependency-groups]
dev = ["pytest>=8,<9", "jiwer>=3.0.3,<4"]
# Decoder experiment only (scripts/test_decoders.py): official T-one runtime +
# pyctcdecode/kenlm + microphone capture. Not used by dataset generation.
#   uv sync --group decoders
decoders = [
    "tone @ git+https://github.com/voicekit-team/T-one",
    "sounddevice>=0.5,<1",
]

# PC-only (RTX 4060, CUDA): exactly the official T-one finetune extra plus CUDA
# torch. Never installed on the Mac during dataset generation.
#   pip install "tone[finetune] @ git+https://github.com/voicekit-team/T-one"
[project.optional-dependencies]
finetune = [
    "tone @ git+https://github.com/voicekit-team/T-one",
    "transformers>=4.45,<5",
    "accelerate>=0.34,<1",
    "datasets>=2.20,<4",
    "evaluate>=0.4,<1",
    "jiwer>=3.0.3,<5",
    "librosa>=0.9.2,<1",
    "soundfile>=0.13.1,<1",
    "torch>=2.7,<3",
    "torchaudio>=2.7,<3",
    "omegaconf>=2.3,<3",
    "cloudpathlib>=0.16,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

